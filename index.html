<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pameran Aset Pixel Art</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; color: white; }
        canvas { border: 4px solid #fff; background: #4a7c59; image-rendering: pixelated; margin-bottom: 15px; }
        .control-panel { background: #2c3e50; padding: 15px; border-radius: 8px; text-align: center; }
        .btn { background: #e74c3c; color: white; border: none; padding: 10px 15px; margin: 5px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-green { background: #2ecc71; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="420"></canvas>
    <div class="control-panel">
        <div>🕹️ PANEL UJI COBA ANIMASI (6 FRAME)</div>
        <button class="btn" id="btn-i-down">Idle Depan</button>
        <button class="btn" id="btn-i-up">Idle Belakang</button>
        <button class="btn" id="btn-i-right">Idle Kanan</button>
        <button class="btn" id="btn-i-left">Idle Kiri</button>
        <br>
        <button class="btn btn-green" id="btn-w-down">Walk Depan</button>
        <button class="btn btn-green" id="btn-w-up">Walk Belakang</button>
        <button class="btn btn-green" id="btn-w-right">Walk Kanan</button>
        <button class="btn btn-green" id="btn-w-left">Walk Kiri</button>
    </div>
    <!-- Memanggil file script kedua -->
    <script src="script.js"></script>
</body>
</html>
