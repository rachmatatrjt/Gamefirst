<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Main Character - Professional Showcase v5 ⚡</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #090a0f; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            min-height: 100vh; 
            /* MENGGUNAKAN FONT MONOSPACE RETRO YANG SERASI DENGAN PIXEL ART */
            font-family: 'Courier New', Courier, monospace; 
            color: #8c9ba5; /* Warna teks dasar abu-abu redup agar tidak kontras tinggi */
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .showroom-title { 
            margin-top: 15px; margin-bottom: 12px; font-weight: 800; letter-spacing: 4px; 
            color: #a48c64; /* Warna emas tembaga redup (Low-Contrast dengan warna bodi karakter) */
            font-size: 14px; text-transform: uppercase;
        }
        .showroom-container { text-align: center; position: relative; padding: 10px; max-width: 95vw; }
        
        canvas { 
            border: 3px solid #1a222d; border-radius: 20px; background: #141913; 
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            image-rendering: -moz-crisp-edges; image-rendering: -webkit-crisp-edges; image-rendering: pixelated; image-rendering: crisp-edges;
            max-width: 100%; height: auto;
        }

        /* TATA LETAK D-PAD RETRO DI LUAR KANVAS GAME */
        .dpad-container {
            margin: 20px auto 10px auto;
            display: grid;
            grid-template-columns: repeat(3, 76px);
            grid-template-rows: repeat(3, 76px);
            gap: 2px;
            width: 230px;
            height: 230px;
        }
        .dpad-btn {
            width: 76px;
            height: 76px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            image-rendering: pixelated;
        }
        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

        .info-panel { 
            background: rgba(22, 28, 37, 0.6); padding: 8px 24px; border-radius: 30px; 
            font-size: 11px; color: #5c6b73; /* Abu-abu redup menyatu dengan tema mistis */
            border: 1px solid #1a222d; margin-top: 12px; display: inline-block;
            backdrop-filter: blur(6px); letter-spacing: 1px;
        }
        .info-panel b { 
            color: #7a8462; /* Status warna hijau lumut redup, aman bagi mata */
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="showroom-container">
        <div class="showroom-title">Live Asset Showcase</div>
        
        <canvas id="gameCanvas" width="1200" height="840"></canvas>
        
        <br>
        
        <div class="dpad-container">
            <div id="btn-up" class="dpad-btn"></div>
            <div id="btn-left" class="dpad-btn"></div>
            <div id="btn-right" class="dpad-btn"></div>
            <div id="btn-down" class="dpad-btn"></div>
        </div>

        <div class="info-panel">Status: <b id="status-txt">IDLE</b> • Mode: D-Pad Retro</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
