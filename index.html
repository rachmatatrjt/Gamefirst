<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pixel Clicker Sederhana</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
        }
        .game-container {
            background-color: #34495e;
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        /* Tombol utama untuk di-klik - bisa diganti gambar Aseprite nanti */
        #pixel-btn {
            width: 120px;
            height: 120px;
            background-color: #e74c3c;
            border: 4px solid #c0392b;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px auto;
            transition: transform 0.1s;
        }
        #pixel-btn:active {
            transform: scale(0.9);
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Koin: <span id="score-text">0</span></h1>
        <!-- Ini adalah tombol yang mendeteksi klik -->
        <div id="pixel-btn"></div>
        <p>Klik kotak merah untuk mengumpulkan koin!</p>
    </div>

    <script>
        // Mengambil elemen HTML ke dalam JavaScript (Otak Game)
        let score = 0;
        const scoreText = document.getElementById('score-text');
        const pixelBtn = document.getElementById('pixel-btn');

        // Logika saat tombol di-klik
        pixelBtn.addEventListener('click', () => {
            score++;
            scoreText.textContent = score;
            
            // Efek ganti warna acak saat di-klik agar seru
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
            const randomColor = colors[Math-floor(Math.random() * colors.length)];
            pixelBtn.style.backgroundColor = randomColor;
        });
    </script>

</body>
</html>
