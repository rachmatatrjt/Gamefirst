<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pameran Aset Pixel Art - 8 Animasi System</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; 
        }
        canvas { 
            border: 4px solid #fff; background: #4a7c59; 
            image-rendering: -moz-crisp-edges; image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated; image-rendering: crisp-edges;
        }
        #promo-box { 
            position: absolute; bottom: 20px; background: rgba(0,0,0,0.9); color: white; 
            padding: 15px; border-radius: 8px; display: none; text-align: center; 
            width: 80%; max-width: 450px; border: 2px solid #f1c40f;
        }
        #promo-box a { color: #5dade2; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="500"></canvas>
    
    <div id="promo-box">
        <h3 id="promo-title">✨ Suka dengan Aset Ini? ✨</h3>
        <p id="promo-desc">Dapatkan paket lengkap <b>Customizable Character (105+ Kombinasi)</b> untuk proyek game Anda!</p>
        <a href="https://itch.io" target="_blank">Beli Paket Aset di Itch.io →</a>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const promoBox = document.getElementById("promo-box");

        // ========================================================
        // 1. MEMUAT DAFTAR ASET (6 File Gambar Sumber)
        // ========================================================
        const imgIdleBawah = new Image(); imgIdleBawah.src = "Main_character-Idle_down-Base_body-Engine";
        const imgIdleAtas   = new Image(); imgIdleAtas.src   = "Main_character-Idle_up-Base_body-Engine";
        const imgIdleSamping = new Image(); imgIdleSamping.src = "Main_character-Idle_side-Base_body-Engine";

        const imgWalkBawah  = new Image(); imgWalkBawah.src  = "Main_character-Walk_down-Base_body-Engine";
        const imgWalkAtas   = new Image(); imgWalkAtas.src   = "Main_character-Walk_up-Base_body-Engine";
        const imgWalkSamping = new Image(); imgWalkSamping.src = "Main_character-Walk_side-Base_body-Engine";

        // Memastikan semua gambar siap dibaca browser sebelum game dimulai
        let loadedCount = 0;
        function onImageLoad() {
            loadedCount++;
            if (loadedCount === 6) { gameLoop(); }
        }
        imgIdleBawah.onload = onImageLoad; imgIdleAtas.onload = onImageLoad; imgIdleSamping.onload = onImageLoad;
        imgWalkBawah.onload = onImageLoad;  imgWalkAtas.onload = onImageLoad;  imgWalkSamping.onload = onImageLoad;

        // ========================================================
        // 2. VARIABEL STATUS PEMAIN (State Machine)
        // ========================================================
        let player = {
            x: 250,                   // Posisi awal horizontal
            y: 350,                   // Posisi awal vertikal
            size: 32,                 // Ukuran satu frame potong (32x32 pixel)
            scale: 3.5,               // Skala pembesaran visual web
            speed: 2.5,               // Kecepatan gerak karakter
            
            // Logika Arah & Kondisi Animasi
            direction: "bawah",       // Nilai arah: "bawah", "atas", "samping"
            isFlipped: false,         // Variabel Boolean: True jika menghadap KIRI (gambar dibalik)
            state: "idle",            // Nilai status: "idle" atau "walk"
            
            // Penghitung Frame (0 - 5)
            currentFrame: 0,
            animTimer: 0,
            animSpeed: 8              // Makin kecil angkanya makin cepat gerak kakinya
        };

        let displaySize = player.size * player.scale;

        // Objek Kios
        let shop = { x: 250, y: 100, width: 80, height: 70, color: "#f1c40f" };

        // Input Keyboard
        let keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // ========================================================
        // 3. LOGIKA UPDATE PERGERAKAN DAN ANIMASI
        // ========================================================
        function updateGame() {
            let movingX = 0;
            let movingY = 0;

            // Deteksi penekanan tombol
            if (keys["arrowup"] || keys["w"]) movingY = -1;
            if (keys["arrowdown"] || keys["s"]) movingY = 1;
            if (keys["arrowleft"] || keys["a"]) movingX = -1;
            if (keys["arrowright"] || keys["d"]) movingX = 1;

            // Menentukan State: Jalan atau Diam
            if (movingX !== 0 || movingY !== 0) {
                player.state = "walk";
                player.x += movingX * player.speed;
                player.y += movingY * player.speed;

                // Penentuan Arah Prioritas Animasi
                if (movingY === -1) player.direction = "atas";
                if (movingY === 1)  player.direction = "bawah";
                
                if (movingX === 1) {
                    player.direction = "samping";
                    player.isFlipped = false; // Hadap Kanan asli
                } else if (movingX === -1) {
                    player.direction = "samping";
                    player.isFlipped = true;  // Hadap Kiri (Aktifkan sistem Flip)
                }
            } else {
                player.state = "idle"; // Kembali ke animasi diam jika tidak tekan tombol
            }

            // Batasi karakter di area layar canvas
            player.x = Math.max(0, Math.min(canvas.width - displaySize, player.x));
            player.y = Math.max(0, Math.min(canvas.height - displaySize, player.y));

            // Perputaran Frame 6 Slot Animasi (0 sampai 5)
            player.animTimer++;
            if (player.animTimer >= player.animSpeed) {
                player.animTimer = 0;
                player.currentFrame = (player.currentFrame + 1) % 6;
            }

            // Hitung jarak ke kios
            let distance = Math.hypot((player.x + displaySize/2) - (shop.x + shop.width/2), (player.y + displaySize/2) - (shop.y + shop.height/2));
            if (distance < 80) { promoBox.style.display = "block"; } else { promoBox.style.display = "none"; }
        }

        // ========================================================
        // 4. MENGGAMBAR KE LAYAR DAN SISTEM PEMBALIK GRAPHIC (FLIP)
        // ========================================================
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Y-Sorting Perspektif 3/4
            if (player.y + displaySize - 10 < shop.y + shop.height) {
                drawPlayer(); drawShop();
            } else {
                drawShop(); drawPlayer();
            }

            // Navigasi Petunjuk Atas
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(10, 10, 520, 30);
            ctx.fillStyle = "#ffffff"; ctx.font = "12px monospace";
            ctx.fillText("🎮 Kontrol WASD/ARROW. Tes sistem: 4 Idle + 4 Walk (Auto-Flip Kiri)", 20, 30);
        }

        function drawShop() {
            ctx.fillStyle = shop.color; ctx.fillRect(shop.x, shop.y, shop.width, shop.height);
            ctx.fillStyle = "#ffffff"; ctx.font = "12px monospace"; ctx.fillText("ASET RACHMATA", shop.x + 10, shop.y + 40);
        }

        function drawPlayer() {
            // Memilih Gambar Spritesheet Berdasarkan Gabungan State dan Arah
            let activeImg = imgIdleBawah; // Nilai default cadangan

            if (player.state === "idle") {
                if (player.direction === "bawah") activeImg = imgIdleBawah;
                if (player.direction === "atas")   activeImg = imgIdleAtas;
                if (player.direction === "samping") activeImg = imgIdleSamping;
            } else if (player.state === "walk") {
                if (player.direction === "bawah") activeImg = imgWalkBawah;
                if (player.direction === "atas")   activeImg = imgWalkAtas;
                if (player.direction === "samping") activeImg = imgWalkSamping;
            }

            // Hitung titik potong sumbu X pada lembar frame gambar (0, 32, 64, dst)
            let clipX = player.currentFrame * player.size;

            ctx.save(); // Amankan orientasi normal canvas

            if (player.isFlipped) {
                // LOGIKA FLIP KANVAS JAVASCRIPT:
                // Menggeser koordinat pusat canvas lalu membalik nilainya menjadi minus (-)
                ctx.translate(player.x + displaySize, player.y);
                ctx.scale(-1, 1);
                
                ctx.drawImage(
                    activeImg,
                    clipX, 0, player.size, player.size,
                    0, 0, displaySize, displaySize // Posisi digambar di titik 0 karena koordinatnya sudah digeser translate()
                );
            } else {
                // Menggambar normal tanpa efek flip balik baju
                ctx.drawImage(
                    activeImg,
                    clipX, 0, player.size, player.size,
                    player.x, player.y, displaySize, displaySize
                );
            }

            ctx.restore(); // Kembalikan setelan canvas ke keadaan normal untuk objek lainnya
        }

        function gameLoop() {
            updateGame(); drawGame(); requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
