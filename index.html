<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Main Character - Professional Showcase ⚡</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #090a0f; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Segoe UI', -apple-system, sans-serif; color: #f8fafc;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .showroom-title { 
            margin-bottom: 12px; font-weight: 800; letter-spacing: 4px; color: #38bdf8; 
            font-size: 14px; text-transform: uppercase; text-shadow: 0 0 20px rgba(56,189,248,0.4);
        }
        .showroom-container { text-align: center; position: relative; padding: 15px; max-width: 95vw; }
        canvas { 
            border: 3px solid #1e293b; border-radius: 20px; background: #141913; 
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            image-rendering: -moz-crisp-edges; image-rendering: -webkit-crisp-edges; image-rendering: pixelated; image-rendering: crisp-edges;
            max-width: 100%; height: auto;
        }
        .info-panel { 
            background: rgba(30, 41, 59, 0.4); padding: 8px 24px; border-radius: 30px; 
            font-size: 11px; font-family: monospace; color: #64748b; 
            border: 1px solid #1e293b; margin-top: 12px; display: inline-block;
            backdrop-filter: blur(6px); letter-spacing: 1px;
        }
        .info-panel b { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="showroom-container">
        <div class="showroom-title">⚡ Live Asset Showcase ⚡</div>
        <canvas id="gameCanvas" width="1200" height="840"></canvas>
        <br>
        <div class="info-panel">Sistem Kendali: <b id="status-txt">IDLE</b> • Mode: <b>D-Pad Retro Button</b></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
