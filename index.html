<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pameran Aset Pixel Art - Automated Asset Showroom</title>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Courier New', Courier, monospace; 
            color: white;
        }
        .showroom-container {
            text-align: center;
            position: relative;
        }
        canvas { 
            border: 4px solid #fff; 
            background: #4a7c59; 
            image-rendering: -moz-crisp-edges; 
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            margin-bottom: 15px;
        }
        .control-panel {
            background: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: inline-block;
            margin-top: 5px;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: #c0392b; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: #2ecc71; }
        .btn-green:hover { background: #27ae60; }

        #promo-box { 
            position: absolute; 
            bottom: 130px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.95); 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            display: none; 
            text-align: center; 
            width: 80%; 
            max-width: 420px; 
            border: 2px solid #f1c40f;
            z-index: 10;
        }
        #promo-box a { color: #5dade2; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="showroom-container">
        <canvas id="gameCanvas" width="600" height="420"></canvas>
        
        <div id="promo-box">
            <h3 id="promo-title">✨ Paket Aset Siap Pakai ✨</h3>
            <p id="promo-desc">Menyukai kehalusan animasi 6-frame ini? Dapatkan paket penuh <b>Customizable Character</b> di toko kami!</p>
            <a href="https://itch.io" target="_blank">Kunjungi Link Pembelian Toko →</a>
        </div>

        <!-- PANEL UI TOMBOL WEB INTERAKTIF -->
        <div class="control-panel">
            <div style="margin-bottom: 8px; font-size: 12px; color: #bdc3c7;">🕹️ PANEL UJI COBA ANIMASI (6 FRAME)</div>
            <button class="btn" onclick="setAnimation('idle', 'down')">Idle Depan</button>
            <button class="btn" onclick="setAnimation('idle', 'up')">Idle Belakang</button>
            <button class="btn" onclick="setAnimation('idle', 'side', false)">Idle Kanan</button>
            <button class="btn" onclick="setAnimation('idle', 'side', true)">Idle Kiri</button>
            <br>
            <button class="btn btn-green" onclick="setAnimation('walk', 'down')">Walk Depan</button>
            <button class="btn btn-green" onclick="setAnimation('walk', 'up')">Walk Belakang</button>
            <button class="btn btn-green" onclick="setAnimation('walk', 'side', false)">Walk Kanan</button>
            <button class="btn btn-green" onclick="setAnimation('walk', 'side', true)">Walk Kiri</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const promoBox = document.getElementById("promo-box");

        // ========================================================
        // 1. DAFTAR SUMBER GAMBAR SINKRON DENGAN SCRIPT ASEPRITE Anda
        // ========================================================
        // Ditambahkan ekstensi .png secara otomatis di ujung string nama file
        const imgIdleDown   = new Image(); imgIdleDown.src   = "Main_character-Idle_down-Base_body-Engine.png";
        const imgIdleUp     = new Image(); imgIdleUp.src     = "Main_character-Idle_up-Base_body-Engine.png";
        const imgIdleSide   = new Image(); imgIdleSide.src   = "Main_character-Idle_side-Base_body-Engine.png";

        const imgWalkDown   = new Image(); imgWalkDown.src   = "Main_character-Walk_down-Base_body-Engine.png";
        const imgWalkUp     = new Image(); imgWalkUp.src     = "Main_character-Walk_up-Base_body-Engine.png";
        const imgWalkSide   = new Image(); imgWalkSide.src   = "Main_character-Walk_side-Base_body-Engine.png";

        // ========================================================
        // 2. VARIABEL KONFIGURASI UTAMA PEMAIN
        // ========================================================
        let player = {
            x: 240,                   // Nilai posisi horizontal
            y: 250,                   // Nilai posisi vertikal
            size: 32,                 // Ukuran kotak aset 32x32 pixel asli
            scale: 3.5,               // Pembesaran visual piksel di web browser
            speed: 2.5,
            
            direction: "down",        // Sesuai penamaan Anda: "down", "up", "side"
            isFlipped: false,         // Nilai Boolean: True jika memicu arah Kiri (Flipping grafik)
            state: "idle",            // Nilai status: "idle" atau "walk"
            
            currentFrame: 0,          // Indeks frame aktif (0 sampai 5)
            animTimer: 0,
            animSpeed: 8              // Kecepatan putaran frame kaki melangkah
        };

        let displaySize = player.size * player.scale;

        // Objek Bangunan Batas Uji Kedalaman (Y-Sorting)
        let shop = { x: 260, y: 80, width: 80, height: 70, color: "#f1c40f" };

        let keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Fungsi pemicu klik tombol UI bawah
        function setAnimation(state, direction, isFlipped = false) {
            player.state = state;
            player.direction = direction;
            player.isFlipped = isFlipped;
            player.currentFrame = 0; 
        }

        // ========================================================
        // 3. LOGIKA UPDATE STATUS PERGERAKAN (GDScript Logic Style)
        // ========================================================
        function updateGame() {
            let movingX = 0;
            let movingY = 0;

            if (keys["arrowup"] || keys["w"]) movingY = -1;
            if (keys["arrowdown"] || keys["s"]) movingY = 1;
            if (keys["arrowleft"] || keys["a"]) movingX = -1;
            if (keys["arrowright"] || keys["d"]) movingX = 1;

            if (movingX !== 0 || movingY !== 0) {
                player.state = "walk";
                player.x += movingX * player.speed;
                player.y += movingY * player.speed;

                if (movingY === -1) player.direction = "up";
                if (movingY === 1)  player.direction = "down";
                
                if (movingX === 1) { player.direction = "side"; player.isFlipped = false; }
                else if (movingX === -1) { player.direction = "side"; player.isFlipped = true; }
            }

            player.x = Math.max(0, Math.min(canvas.width - displaySize, player.x));
            player.y = Math.max(0, Math.min(canvas.height - displaySize, player.y));

            // Perputaran Siklus 6 Frame Lembar Gambar
            player.animTimer++;
            if (player.animTimer >= player.animSpeed) {
                player.animTimer = 0;
                player.currentFrame = (player.currentFrame + 1) % 6;
            }

            let distance = Math.hypot((player.x + displaySize/2) - (shop.x + shop.width/2), (player.y + displaySize/2) - (shop.y + shop.height/2));
            if (distance < 75) { promoBox.style.display = "block"; } else { promoBox.style.display = "none"; }
        }

        // ========================================================
        // 4. RENDERING GRAPHIC & AUTO-FLIP SYSTEM
        // ========================================================
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (player.y + displaySize - 15 < shop.y + shop.height) {
                drawPlayer(); drawShop();
            } else {
                drawShop(); drawPlayer();
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(15, 15, 520, 30);
            ctx.fillStyle = "#ffffff"; ctx.font = "12px monospace";
            ctx.fillText("🎮 Jalankan dengan Keyboard ATAU Tes Klik Panel Menu di Bawah!", 25, 34);
        }

        function drawShop() {
            ctx.fillStyle = shop.color; ctx.fillRect(shop.x, shop.y, shop.width, shop.height);
            ctx.fillStyle = "#2c3e50"; ctx.font = "bold 11px monospace"; ctx.fillText("ASET KIOS", shop.x + 10, shop.y + 40);
        }

        function drawPlayer() {
            let activeImg = imgIdleDown;

            // Pemilihan variabel gambar aktif berdasarkan kombinasi State & Arah hadap
            if (player.state === "idle") {
                if (player.direction === "down") activeImg = imgIdleDown;
                if (player.direction === "up")   activeImg = imgIdleUp;
                if (player.direction === "side") activeImg = imgIdleSide;
            } else if (player.state === "walk") {
                if (player.direction === "down") activeImg = imgWalkDown;
