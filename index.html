<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Asset Showcase - Phaser Edition ⚡</title>
    <!-- Memanggil Phaser.js Engine dari Internet -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background: #0f1115; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; color: #e2e8f0; }
        #game-container { border: 3px solid #1e293b; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .control-panel { background: #1e293b; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: center; border: 1px solid #334155; }
        .btn { background: #e74c3c; color: white; border: none; padding: 8px 12px; margin: 4px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; }
        .btn-green { background: #2ecc71; }
    </style>
</head>
<body>

    <h2 style="color:#38bdf8; margin-bottom:10px;">Asset Live Tester (Phaser)</h2>
    
    <!-- Wadah tempat game Phaser digambar -->
    <div id="game-container"></div>

    <div class="control-panel">
        <div style="font-size:12px; color:#94a3b8; margin-bottom:5px;">🕹️ TESTING PANEL ANIMASI</div>
        <button class="btn" id="btn-i-down">Idle Depan</button>
        <button class="btn" id="btn-i-up">Idle Belakang</button>
        <button class="btn" id="btn-i-side">Idle Samping</button>
        <br>
        <button class="btn btn-green" id="btn-w-down">Walk Depan</button>
        <button class="btn btn-green" id="btn-w-up">Walk Belakang</button>
        <button class="btn btn-green" id="btn-w-side">Walk Samping</button>
    </div>

    <!-- Memanggil script logika game -->
    <script src="script.js"></script>
</body>
</html>
